# 证件照工具三平台自动构建
# 触发：推送 v 开头 tag（如 v1.0.0）→ 构建三平台安装包并发布 GitHub Release
name: build

# 新仓库 GITHUB_TOKEN 默认 Contents: read；发 Release 需要写权限
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # Windows x64：portable + nsis
          - os: macos-latest     # Apple 芯片 runner；mac.target 双 arch 一并产出 x64 dmg
          - os: ubuntu-latest    # Linux x64：AppImage + deb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          draft: true
          generate_release_notes: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idphoto-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
